services:
  # Zookeeper для Kafka
  zookeeper:
    image: wurstmeister/zookeeper
    container_name: zookeeper
    ports:
      - "2181:2181"
    networks:
      - app-network

  # Kafka
  kafka:
    image: wurstmeister/kafka
    container_name: kafka
    environment:
      KAFKA_ADVERTISED_LISTENERS: INSIDE://kafka:9093
      KAFKA_LISTENERS: INSIDE://0.0.0.0:9093,OUTSIDE://0.0.0.0:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INSIDE:PLAINTEXT,OUTSIDE:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INSIDE
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
    ports:
      - "9092:9092" # Открытый порт для внешнего доступа
    depends_on:
      - zookeeper
    networks:
      - app-network

    #Database
  database:
    image: postgres:latest
    container_name: database
    environment:
      POSTGRES_DB: deal
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 5117
    ports:
      - "5433:5432"
    networks:
      - app-network

  # Calculator
  calculator:
    build:
      context: ./calculator
      dockerfile: Dockerfile
    ports:
      - "7071:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
    networks:
      - app-network

  # Deal
  deal:
    build:
      context: ./deal
      dockerfile: Dockerfile
    ports:
      - "7072:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://database:5432/deal
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: 5117
    depends_on:
      - calculator
    networks:
      - app-network

  # Dossier
  dossier:
    build:
      context: ./dossier
      dockerfile: Dockerfile
    ports:
      - "7073:8080"
    environment:
      - BOOTSTRAP-SERVERS=kafka:9093
      - MAIL_USERNAME=${MAIL_USERNAME}
      - MAIL_PASSWORD=${MAIL_PASSWORD}
    depends_on:
      - deal
    networks:
      - app-network

  # Gateway
  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    ports:
      - "7074:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
    depends_on:
      - deal
    networks:
      - app-network

  # Statement
  statement:
    build:
      context: ./statement
      dockerfile: Dockerfile
    ports:
      - "7075:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
    depends_on:
      - deal
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
